# CI: on every PR and push to main, runs the same checks devs can run locally.
name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Lint, format, typecheck, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Typecheck
              run: npm run typecheck
            - name: Build
              run: npm run build
